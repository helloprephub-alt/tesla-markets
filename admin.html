<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Markets Admin | Private Management</title>
    <meta name="theme-color" content="#101820" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="Private Tesla Markets management console and customer inbox." />
    <link rel="manifest" href="/admin-manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/admin-logo.jpg" />
    <link rel="apple-touch-icon" href="/icons/admin-logo.jpg" />
    <meta name="application-name" content="Tesla Markets Admin" />
    <script>
      (() => {
        const url = new URL(window.location.href);
        if (!url.searchParams.has('page')) {
          url.searchParams.set('page', 'admin');
          url.searchParams.set('app', 'tesla-markets-admin');
          window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
