name: Tesla Markets chat repair checks

on:
  push:
    branches:
      - repair/customer-chat-ai-20261123
      - repair/vehicle-checkout-production-20261124

permissions:
  contents: read

jobs:
  build-and-chat-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without generating a lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run complete production build checks
        run: npm run build
