name: Tesla Markets chat repair checks

on:
  push:
    branches:
      - repair/customer-chat-ai-20261123

permissions:
  contents: read

jobs:
  build-and-chat-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete production build checks
        run: npm run build
